name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas de la lógica pura
        run: ./gradlew -p logic test

      - name: Pruebas de los scripts de firma
        run: bash scripts/signing/test-signing-scripts.sh

      - name: Pruebas de la app y APK de depuración y release
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      # Sin RECETARIO_KEYSTORE, el APK release sale sin firmar. Su versión debe
      # salir de app/version.properties: versionCode = major*10000 + minor*100 + patch.
      - name: Comprobar el APK release sin firmar y su versión
        run: |
          dir=app/build/outputs/apk/release
          test -f "$dir/app-release-unsigned.apk"
          jq '.elements[0] | {versionCode, versionName, outputFile}' "$dir/output-metadata.json"
          IFS=. read -r major minor patch < <(sed -n 's/^versionName=//p' app/version.properties)
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          jq -e --argjson code "$code" --arg name "$major.$minor.$patch" \
            '.elements[0] | .versionCode == $code and .versionName == $name
              and .outputFile == "app-release-unsigned.apk"' \
            "$dir/output-metadata.json"

      # Ensaya la firma de release.yml con una llave desechable (frase de prueba,
      # no la real): el APK debe salir firmado por CN=Recetario.
      - name: Ensayar la firma con una llave de prueba
        env:
          SIGNING_PASSPHRASE: frase de prueba solo para CI
        run: |
          export RECETARIO_KEYSTORE="$RUNNER_TEMP/prueba.p12"
          trap 'rm -f "$RECETARIO_KEYSTORE"' EXIT
          scripts/signing/create-keystore.sh "$RUNNER_TEMP/prueba.p12.enc"
          scripts/signing/decrypt-keystore.sh "$RUNNER_TEMP/prueba.p12.enc" "$RECETARIO_KEYSTORE"
          ./gradlew assembleRelease
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk |
            tee "$RUNNER_TEMP/firma.txt"
          grep -q 'certificate DN: CN=Recetario$' "$RUNNER_TEMP/firma.txt"

      - name: Subir informes de prueba
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: informes-de-prueba
          path: |
            logic/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
