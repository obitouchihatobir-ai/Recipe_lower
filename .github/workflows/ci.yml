name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Pruebas de la lógica pura
        run: ./gradlew -p logic test

      - name: Pruebas de la app y APK de depuración
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Subir informes de prueba
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-prueba
          path: |
            logic/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
