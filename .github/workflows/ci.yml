name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas de la lógica pura
        run: ./gradlew -p logic test

      - name: Pruebas de la app y APK de depuración y release
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease

      # Sin RECETARIO_KEYSTORE, el APK release sale sin firmar. Su versión debe
      # salir de app/version.properties: versionCode = major*10000 + minor*100 + patch.
      - name: Comprobar el APK release sin firmar y su versión
        run: |
          dir=app/build/outputs/apk/release
          test -f "$dir/app-release-unsigned.apk"
          jq '.elements[0] | {versionCode, versionName, outputFile}' "$dir/output-metadata.json"
          IFS=. read -r major minor patch < <(sed -n 's/^versionName=//p' app/version.properties)
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          jq -e --argjson code "$code" --arg name "$major.$minor.$patch" \
            '.elements[0] | .versionCode == $code and .versionName == $name
              and .outputFile == "app-release-unsigned.apk"' \
            "$dir/output-metadata.json"

      - name: Subir informes de prueba
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: informes-de-prueba
          path: |
            logic/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore
